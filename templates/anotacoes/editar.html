{% extends 'base.html' %}
{% block title %}Editar anotação — Lírion{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">

    <h3 style="font-family: Georgia, serif; color: #2D1B69;" class="mb-1">
      Editar anotação
    </h3>
    <p class="text-muted small mb-4">
      {{ anotacao.livro.titulo }}
    </p>

    <form method="post">
      {% csrf_token %}
      {{ form.texto }}
      <div class="mt-3 d-flex gap-2">
        <button type="submit"
                class="btn"
                style="background-color: #6B21A8; color: white;">
          Salvar alterações
        </button>
        <a href="{% url 'anotacoes:pagina_livro' anotacao.livro.id %}"
           class="btn btn-outline-secondary">
          Cancelar
        </a>
      </div>
    </form>

  </div>
</div>

{% endblock %}
