{% extends 'base.html' %}
{% block title %}Nova senha — Lírion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    {% if validlink %}
      <h2 class="mb-3" style="font-family: Georgia, serif; color:#2D1B69;">Nova senha</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn w-100" style="background-color:#6B21A8; color:white;">Redefinir senha</button>
      </form>
    {% else %}
      <p class="text-danger">Este link é inválido ou já expirou. Solicite um novo.</p>
      <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary">Solicitar novo link</a>
    {% endif %}
  </div>
</div>
{% endblock %}
