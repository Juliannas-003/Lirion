{% extends 'base.html' %}
{% block title %}Entrar — Lírion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h2 class="mb-4" style="font-family: Georgia, serif; color: #2D1B69;">Entrar</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn w-100 mt-2" style="background-color: #6B21A8; color: white;">
                Entrar
            </button>
        </form>
        <p class="mt-3 text-center text-muted">
            Não tem conta? <a href="/accounts/cadastro/" style="color: #6B21A8;">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
