{% extends 'base.html' %}
{% block title %}Entrar — Lírion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h2 class="mb-4" style="font-family: Georgia, serif; color: #2D1B69;">Entrar</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuário</label>
                <input type="text" name="username" id="id_username"
                       class="form-control" autofocus required>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Senha</label>
                <input type="password" name="password" id="id_password"
                       class="form-control" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger py-2">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}
            <button type="submit" class="btn w-100 mt-1"
                    style="background-color: #6B21A8; color: white;">
                Entrar
            </button>
        </form>
        <p class="mt-3 text-center text-muted">
            Não tem conta?
            <a href="/accounts/cadastro/" style="color: #6B21A8;">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
