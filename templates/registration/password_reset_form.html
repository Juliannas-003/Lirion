{% extends 'base.html' %}
{% block title %}Recuperar senha — Lírion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <h2 class="mb-3" style="font-family: Georgia, serif; color:#2D1B69;">Recuperar senha</h2>
    <p class="text-muted small mb-4">Informe seu e-mail cadastrado. Enviaremos um link para redefinir sua senha.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn w-100" style="background-color:#6B21A8; color:white;">Enviar link</button>
    </form>
  </div>
</div>
{% endblock %}
