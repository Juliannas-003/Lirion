<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lírion{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/lirion.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2D1B69;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" style="color: #F59E0B; font-family: Georgia, serif; letter-spacing: 2px;">
                LÍRION
            </a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link text-white-50" href="{% url 'livros:buscar' %}">Buscar livro</a>
                    <!-- Link pra estante -->
                    <a class="nav-link text-white-50" href="{% url 'livros:estante' %}">Minha estante</a>
                    <form method="post" action="/accounts/logout/" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav-link text-white-50 btn btn-link p-0 border-0">
                            Sair ({{ user.username }})
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link text-white-50" href="/accounts/login/">Entrar</a>
                    <a class="nav-link" href="/accounts/cadastro/" style="color: #F59E0B;">Criar conta</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
