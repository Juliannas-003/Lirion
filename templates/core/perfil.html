{% extends 'base.html' %}
{% block title %}Meu perfil — Lírion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <h2 class="mb-4" style="font-family: Georgia, serif; color: #2D1B69;">Meu perfil</h2>

    <div class="text-center mb-4">
      {% if user.foto %}
        <img src="{{ user.foto.url }}" class="rounded-circle shadow"
             style="width:120px; height:120px; object-fit:cover;">
      {% else %}
        <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mx-auto"
             style="width:120px; height:120px;">
          <span style="font-size:2.5rem;">👤</span>
        </div>
      {% endif %}
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Foto de perfil</label>
        {{ form.foto }}
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        {{ form.email }}
      </div>
      <div class="mb-3">
        <label class="form-label">Sobre você</label>
        {{ form.bio }}
      </div>
      <button type="submit" class="btn w-100" style="background-color:#6B21A8; color:white;">
        Salvar alterações
      </button>
    </form>
  </div>
</div>
{% endblock %}
